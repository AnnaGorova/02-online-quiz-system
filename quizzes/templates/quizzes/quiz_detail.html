{% extends 'quizzes/base.html' %}

{% block title %}{{ quiz.title }}{% endblock %}

{% block content %}
<div class="card">
    <h1>{{ quiz.title }}</h1>
    <p>{{ quiz.description }}</p>
    <p>Всього питань: {{ quiz.questions_count }}</p>
    
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Розпочати тестування</button>
    </form>
</div>
{% endblock %}
