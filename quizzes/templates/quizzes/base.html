{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuizMaster{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'quizzes/css/style.css' %}">
</head>
<body>
    {% include 'quizzes/includes/navbar.html' %}

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    {% include 'quizzes/includes/footer.html' %}
</body>
</html>
